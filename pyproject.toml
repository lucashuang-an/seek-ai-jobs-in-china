[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-radar"
version = "0.1.0"
description = "Seek AI Jobs in China - open-source AI recruitment intelligence agent (company-first, agent-native, evidence-based, local-first)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.45"]
gui = ["streamlit>=1.36"]

[project.scripts]
ai-job-radar = "ai_job_radar.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_job_radar.scoring" = ["default_weights.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
